name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Check Gradle
        run: gradle --version

      - name: Build Admin Debug APK
        run: gradle :app:assembleAdminDebug -PreleaseNumber=$GITHUB_RUN_NUMBER --stacktrace --warning-mode all

      - name: Build Viewer Debug APK
        run: gradle :app:assembleViewerDebug -PreleaseNumber=$GITHUB_RUN_NUMBER --stacktrace --warning-mode all

      - name: Verify APK version codes match release number
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${GITHUB_RUN_NUMBER}"
          # Find an installed aapt instead of hard-coding one Build Tools version.
          AAPT="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name aapt -perm -111 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "${AAPT}" ] || [ ! -x "${AAPT}" ]; then
            echo "ERROR: Android aapt was not found under ${ANDROID_HOME}/build-tools"
            exit 1
          fi

          for APK in app/build/outputs/apk/admin/debug/app-admin-debug.apk app/build/outputs/apk/viewer/debug/app-viewer-debug.apk; do
            test -f "$APK"

            # Extract only the numeric value after versionCode='...'.
            BADGING="$($AAPT dump badging "$APK")"
            CODE="$(printf '%s\n' "$BADGING" | grep -oE "versionCode='[0-9]+'" | head -n 1 | sed "s/versionCode='//;s/'//")"

            if [ -z "$CODE" ]; then
              echo "ERROR: Could not read versionCode from $APK"
              echo "$BADGING"
              exit 1
            fi

            echo "$APK versionCode=$CODE expected=$EXPECTED"
            test "$CODE" = "$EXPECTED"
          done

      - name: Verify APKs and Viewer assets
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/admin/debug/app-admin-debug.apk
          test -f app/build/outputs/apk/viewer/debug/app-viewer-debug.apk
          unzip -l app/build/outputs/apk/viewer/debug/app-viewer-debug.apk | grep -F 'assets/content/001_sample.taz'
          if unzip -l app/build/outputs/apk/viewer/debug/app-viewer-debug.apk | grep -E 'assets/content/.*\.json' >/dev/null; then
            echo 'ERROR: plaintext JSON content was packaged in Viewer APK.'
            exit 1
          fi
          echo 'APK verification passed.'

      - name: Verify Viewer APK contains no Admin-only code or leaked source paths
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/viewer/debug/app-viewer-debug.apk"
          WORKDIR="$(mktemp -d)"
          unzip -q -o "$APK" -d "$WORKDIR" "classes*.dex"

          # این کلاس‌ها فقط باید در app/src/admin/java کامپایل شوند؛ اگر یکی از
          # این نام‌ها در dex واقعی نسخه Viewer پیدا شود، یعنی جداسازی نقض شده
          # (مثلاً به اشتباه دوباره در main یا viewer/java قرار گرفته است).
          FORBIDDEN_CLASSES=(
            "ContentManagementScreen"
            "ContentEditorScreen"
            "DialogueBuilderScreen"
            "ViewerAccessManagementScreen"
            "SpecialUsersManagementScreen"
            "AccessAuditLogScreen"
            "WordContentImport"
            "ContentHealthHelper"
            "ContentTransferHelper"
          )

          FAILED=0
          for CLASS in "${FORBIDDEN_CLASSES[@]}"; do
            if strings "$WORKDIR"/classes*.dex | grep -q "$CLASS"; then
              echo "ERROR: forbidden Admin-only symbol '$CLASS' found in Viewer APK."
              FAILED=1
            fi
          done

          # هیچ مسیر سورس Admin (assets/content یا src/admin) نباید به‌صورت رشته
          # هاردکد داخل کد کامپایل‌شده Viewer وجود داشته باشد، صرف‌نظر از این‌که
          # روی چه دامنه‌ای میزبانی می‌شود.
          if strings "$WORKDIR"/classes*.dex | grep -qE 'src/admin/assets|admin/assets/content'; then
            echo "ERROR: a literal Admin source-asset path was found in Viewer APK."
            FAILED=1
          fi

          rm -rf "$WORKDIR"
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "Viewer code-isolation check passed."

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: tazieh-admin-debug-apk
          path: app/build/outputs/apk/admin/debug/app-admin-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Viewer APK
        uses: actions/upload-artifact@v4
        with:
          name: tazieh-viewer-debug-apk
          path: app/build/outputs/apk/viewer/debug/app-viewer-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="apk-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            app/build/outputs/apk/admin/debug/app-admin-debug.apk \
            app/build/outputs/apk/viewer/debug/app-viewer-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tazieh Android - Admin and Viewer #${GITHUB_RUN_NUMBER}" \
            --notes "Two debug APKs: Admin and offline Viewer." \
            --prerelease

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
